name: Contributor rights

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

concurrency:
  group: contributor-rights-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  record-rights:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Загружается только доверенная main, исходники внешнего PR не исполняются.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const run = require('./.github/scripts/contributor-rights.cjs');
            await run({ github, context, core });
